<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鋼琴練習</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a6c74">
<style>
:root{--bg:#f2f5f7;--sf:#fff;--ink:#14212b;--mut:#5b6b77;--ln:#d3dce2;--ac:#0a6c74;--acfg:#fff;--hint:#d98a00;--on:#0a6c74;--wk:#fff;--bk:#1b2730;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10181e;--sf:#17222a;--ink:#e6eef2;--mut:#93a4b0;--ln:#2b3a44;--ac:#5cc4cc;--acfg:#06262a;--hint:#f0b05a;--on:#5cc4cc;--wk:#dfe7ec;--bk:#0b1116;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 10px;background:var(--sf);border-bottom:1px solid var(--ln)}
button,label.btn{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:var(--acfg);font-weight:600;cursor:pointer}
button.sec,label.btn.sec{background:transparent;color:var(--ac)}button:disabled{opacity:.45}
#status{color:var(--mut);font-size:.9rem;margin-left:auto}
#score{flex:1;min-height:0;overflow:auto;background:#fff;color:#000}
#stage{display:none;flex:1;min-height:0;background:#0d1519}
body.single #score{flex:none;height:var(--lh,160px)}
body.two #score{flex:none;height:var(--lh2,300px)}
body.single #stage,body.two #stage{display:block}
body.single #score::after,body.two #score::after{content:'';display:block;height:var(--lh2,300px)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#ped{display:inline-flex;gap:4px;align-items:center;font-size:.8rem;color:var(--mut)}
#ped b{width:14px;height:14px;border-radius:50%;border:2px solid var(--mut)}
#ped b.on{background:var(--on);border-color:var(--on)}
body[data-mode=glow] #kb .on{box-shadow:0 0 14px 4px var(--on)}
body[data-mode=beginner] .tm{display:none}
select{font:inherit;padding:5px;border-radius:8px;border:1px solid var(--ln);background:var(--sf);color:var(--ink)}
#beg{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:3px 10px;font-size:.85rem;background:var(--sf);border-bottom:1px solid var(--ln)}
#beg input[type=number]{width:3.6em;font:inherit}
body[data-mode=game] #beg{display:none}
.gm{display:none}body[data-mode=game] .gm{display:inline-block}
#info{flex:none;padding:3px 10px;font-size:.95rem;background:#0d1519;color:#cfe;display:flex;gap:18px}
#hud{position:fixed;right:12px;bottom:calc(min(24vh,140px) + 40px);z-index:12;color:#fff;font-weight:800;text-align:right;text-shadow:0 1px 4px #000;display:none;line-height:1.35}
#dlg,#result{position:fixed;inset:0;z-index:30;background:#000a;display:none;align-items:center;justify-content:center}
#dlg.on,#result.on{display:flex}
.card{background:var(--sf);color:var(--ink);border-radius:12px;padding:16px;max-width:min(560px,92vw);max-height:90vh;overflow:auto}
textarea{width:100%;height:26vh;font:13px/1.4 ui-monospace,Consolas,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:8px}
.jp{position:fixed;z-index:15;transform:translateX(-50%);font-weight:800;font-size:.9rem;pointer-events:none;animation:jp .8s ease-out forwards;text-shadow:0 1px 3px #000}
@keyframes jp{to{transform:translate(-50%,-34px);opacity:0}}
.cp{position:fixed;z-index:20;font-weight:900;pointer-events:none;white-space:nowrap;text-shadow:0 3px 0 #0007,0 0 18px currentColor;animation:cp 1.1s ease-out forwards}
@keyframes cp{0%{transform:scale(.2) rotate(var(--r));opacity:0}20%{transform:scale(1.25) rotate(var(--r));opacity:1}70%{transform:scale(1) rotate(var(--r));opacity:1}100%{transform:scale(1.4) rotate(var(--r)) translateY(-40px);opacity:0}}
#rot{display:none;padding:6px 10px;background:var(--hint);color:#000;text-align:center;font-weight:600}
@media (orientation:portrait){#rot{display:block}}
#kb{position:relative;height:min(24vh,140px);flex:none;background:var(--bk);border-top:2px solid var(--ln)}
#kb i{position:absolute;top:0;border:1px solid #0006;border-radius:0 0 3px 3px}
#kb .w{background:var(--wk);height:100%}
#kb .b{background:var(--bk);height:62%;z-index:2;border-color:#000}
#kb .w.hint{background:var(--hint)}#kb .b.hint{background:var(--hint)}
#kb .w.on,#kb .b.on{background:var(--on)}
</style>
</head>
<body>
<div id="rot">請將手機或平板橫放使用</div>
<header>
<select id="mode" aria-label="練習模式"><option value="hint">提示</option><option value="glow">流光溢彩</option><option value="off">關閉</option><option value="beginner">初學者</option><option value="game">遊戲</option></select>
<button id="demo" class="sec">示範曲</button>
<label class="btn sec">匯入琴譜<input id="file" type="file" accept=".musicxml,.xml,.mxl,.mid,.midi,.pdf,.png,.jpg,.jpeg" hidden></label>
<button id="jp" class="sec">簡譜</button>
<button id="ble">連線藍牙琴</button>
<button id="play" class="tm">開始</button>
<label style="font-size:.85rem">速度 <input id="spd" type="range" min="40" max="150" step="10" value="100"><span id="spdv">♩=100</span></label>
<button id="cal" class="sec gm">校準</button>
<button id="next" class="sec">下一步</button>
<button id="reset" class="sec">重來</button>
<button id="fs" class="sec">全螢幕</button>
<span id="ped" title="左／中／右踏板"><b></b><b></b><b></b></span>
<span id="status">載入中…</span>
</header>
<div id="beg">
<label>練習 <select id="hand"><option value="all">雙手</option><option value="0">右手</option><option value="1">左手</option></select></label>
<label><input type="checkbox" id="loop"> 反覆 小節 <input id="la" type="number" min="1" value="1"> 到 <input id="lb" type="number" min="1" value="4"></label>
<label><input type="checkbox" id="metro"> 節拍器</label>
</div>
<div id="score"></div>
<div id="stage"></div>
<div id="info"><span>和弦：<b id="chd">—</b></span><span>調性：<b id="key">—</b></span></div>
<div id="kb" aria-hidden="true"></div>
<canvas id="fx"></canvas>
<div id="hud"></div>
<div id="dlg"><div class="card"></div></div>
<div id="result"><div class="card"></div></div>
<script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@2.2.1/build/opensheetmusicdisplay.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const say = t => $('status').textContent = t;

/* 88 鍵（MIDI 21–108） */
const keyEls = {};
(function(){
  const kb = $('kb'), W = 100 / 52, BK = new Set([1,3,6,8,10]);
  let wi = 0;
  for (let n = 21; n <= 108; n++){
    const i = document.createElement('i');
    if (BK.has(n % 12)){ i.className = 'b'; i.style.width = W * .6 + '%'; i.style.left = (wi * W - W * .3) + '%'; }
    else { i.className = 'w'; i.style.width = W + '%'; i.style.left = wi * W + '%'; wi++; }
    i.dataset.n = n; kb.appendChild(i); keyEls[n] = i;
  }
})();

/* 琴譜、練習模式與特效 */
const LEAD = 1.4, MODES = {off:'關閉', hint:'提示', glow:'流光溢彩', beginner:'初學者', game:'遊戲'};
let osmd = null, steps = [], idx = 0, bpm = 100, spd = 1, mode = 'hint', expected = [], hand = 'all', barQ = 4;
let bars = [], comets = [], playing = false, t0 = 0, spawnI = 0, pieceHist = new Array(12).fill(0);
const held = new Set(), pressed = new Set(), scoreEl = $('score');
const need = st => st.nt.filter(x => hand === 'all' || x.s === +hand).map(x => x.m);
const dlg = html => { $('dlg').firstElementChild.innerHTML = html + '<p><button id="dx">關閉</button></p>'; $('dlg').classList.add('on'); $('dx').onclick = () => $('dlg').classList.remove('on'); };

/* 調性與和弦 */
const NS = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'], NF = ['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const KMAJ = [6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88], KMIN = [6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];
function detectKey(h){
  if (h.reduce((a, b) => a + b, 0) <= 0) return null;
  let best = null;
  for (let pc = 0; pc < 12; pc++) for (const mn of [0, 1]){
    const P = mn ? KMIN : KMAJ; let mx = 0, my = 0;
    for (let i = 0; i < 12; i++){ mx += h[(i + pc) % 12]; my += P[i]; } mx /= 12; my /= 12;
    let sxy = 0, sxx = 0, syy = 0;
    for (let i = 0; i < 12; i++){ const x = h[(i + pc) % 12] - mx, y = P[i] - my; sxy += x * y; sxx += x * x; syy += y * y; }
    const r = sxy / Math.sqrt(sxx * syy || 1);
    if (!best || r > best.r) best = {pc, mn, r};
  }
  return best;
}
const FLATK = k => k && (k.mn ? [2,7,0,5,10,3] : [5,10,3,8,1,6]).includes(k.pc);
const fifthsOf = k => { const p = k.mn ? (k.pc + 3) % 12 : k.pc, f = (p * 7) % 12; return f > 6 ? f - 12 : f; };
const keyName = k => (FLATK(k) ? NF : NS)[k.pc] + (k.mn ? ' 小調' : ' 大調');
const CT = [['',[0,4,7]],['m',[0,3,7]],['dim',[0,3,6]],['aug',[0,4,8]],['sus2',[0,2,7]],['sus4',[0,5,7]],['6',[0,4,7,9]],['m6',[0,3,7,9]],['7',[0,4,7,10]],['maj7',[0,4,7,11]],['m7',[0,3,7,10]],['m7♭5',[0,3,6,10]],['dim7',[0,3,6,9]],['mMaj7',[0,3,7,11]],['7sus4',[0,5,7,10]],['7♯5',[0,4,8,10]],['add9',[0,2,4,7]],['madd9',[0,2,3,7]],['9',[0,2,4,7,10]],['maj9',[0,2,4,7,11]],['m9',[0,2,3,7,10]],['7♭9',[0,1,4,7,10]],['7♯9',[0,3,4,7,10]],['11',[0,2,5,7,10]],['13',[0,2,4,9,10]]];
function chordName(notes, flats){
  const N = flats ? NF : NS, pcs = [...new Set(notes.map(n => n % 12))], bass = Math.min(...notes) % 12;
  if (pcs.length === 2) return pcs.some(r => pcs.includes((r + 7) % 12)) && Math.abs(notes[0] - notes[1]) % 12 === 7 ? N[Math.min(...notes) % 12] + '5' : '';
  if (pcs.length < 3) return '';
  let best = null;
  for (const r of pcs){
    const rel = pcs.map(p => (p - r + 12) % 12);
    for (const [sfx, tpl] of CT){
      const miss = tpl.filter(x => !rel.includes(x)), extra = rel.filter(x => !tpl.includes(x));
      const exact = !miss.length && !extra.length, no5 = tpl.length >= 4 && miss.length === 1 && miss[0] === 7 && !extra.length;
      if (!exact && !no5) continue;
      const sc = (exact ? 100 : 80) - (r !== bass ? 6 : 0) + tpl.length;
      if (!best || sc > best.sc) best = {sc, r, sfx};
    }
  }
  return best ? N[best.r] + best.sfx + (best.r !== bass ? '/' + N[bass] : '') : '';
}
let keyHist = new Array(12).fill(0), nPress = 0, lastKT = 0;
function curKey(){ return nPress >= 8 ? detectKey(keyHist) : detectKey(pieceHist); }
function updateInfo(){
  const k = curKey();
  $('chd').textContent = (held.size >= 2 && chordName([...held], FLATK(k))) || '—';
  $('key').textContent = k ? keyName(k) + (nPress >= 8 ? '' : '（譜）') : '—';
}

function paint(){
  for (const n in keyEls){ const k = keyEls[n]; k.classList.toggle('on', held.has(+n)); k.classList.toggle('hint', expected.includes(+n) && !held.has(+n)); }
  updateInfo();
}
const required = () => osmd.cursor.NotesUnderCursor()
  .filter(n => !n.isRest() && !(n.NoteTie && n.NoteTie.StartNote !== n))
  .map(n => ({m: n.Pitch.getHalfTone() + 12, s: n.ParentStaffEntry.ParentStaff.idInMusicSheet, d: n.Length.RealValue * 4}));
function build(){            // 走過整份譜，記錄每一步的時間、音符與畫面位置
  steps = []; pieceHist = new Array(12).fill(0); const c = osmd.cursor, sr = scoreEl.getBoundingClientRect();
  c.reset();                 // reset 會換新的迭代器，所以每次都重新取 c.Iterator
  let off = 0, prevRaw = -1, prevPb = 0, prevLen = 0;
  while (!c.Iterator.EndReached){
    const r = c.cursorElement.getBoundingClientRect(), nt = required(), raw = c.Iterator.currentTimeStamp.RealValue * 4;
    if (steps.length && raw < prevRaw - 1e-6) off = prevPb + prevLen - raw;   // 反覆記號跳回時，時間軸接續往後
    const pb = raw + off;
    prevRaw = raw; prevPb = pb; prevLen = Math.max(.25, ...c.NotesUnderCursor().map(n => n.Length.RealValue * 4));
    nt.forEach(x => pieceHist[x.m % 12]++);
    steps.push({bt: pb, nt, ms: c.Iterator.CurrentMeasureIndex || 0, x: r.left - sr.left + scoreEl.scrollLeft, y: r.top - sr.top + scoreEl.scrollTop, h: r.height});
    c.next();
  }
  c.reset(); idx = 0;
  if (steps.length){
    const h0 = steps[0].h, nx = steps.find(x => x.y > steps[0].y + h0 * .5), pitch = nx ? nx.y - steps[0].y : h0 + 60, st = document.documentElement.style;
    st.setProperty('--lh', Math.round(h0 + 64) + 'px'); st.setProperty('--lh2', Math.round(pitch + h0 + 64) + 'px');
  }
  try { const ts = osmd.Sheet.SourceMeasures[0].ActiveTimeSignature; barQ = ts.Numerator * 4 / ts.Denominator; } catch (e){ barQ = 4; }
  $('lb').value = Math.min(4, (steps.length ? steps[steps.length - 1].ms + 1 : 4)); $('la').value = 1;
}
function follow(){
  const el = osmd && osmd.cursor.cursorElement; if (!el) return;
  const a = el.getBoundingClientRect(), b = scoreEl.getBoundingClientRect(), top = a.top - b.top + scoreEl.scrollTop;
  scoreEl.scrollTop = document.body.classList.contains('single') || document.body.classList.contains('two') ? top - 32 : Math.max(0, top - scoreEl.clientHeight / 3);
}
function go(n){ while (n-- > 0 && idx < steps.length){ osmd.cursor.next(); idx++; } }
function seek(i){ osmd.cursor.reset(); idx = 0; go(i); }
function refresh(){
  expected = (mode === 'hint' || mode === 'beginner') && idx < steps.length ? need(steps[idx]) : [];
  paint(); follow();
}
const loopRange = () => {
  if (!$('loop').checked || !steps.length) return null;
  const a = +$('la').value - 1, b = +$('lb').value - 1, ia = steps.findIndex(s => s.ms >= a);
  if (ia < 0) return null;
  let ib = ia; for (let i = ia; i < steps.length && steps[i].ms <= b; i++) ib = i;   // 從起點往後連續到終點（避開反覆後再次出現的小節）
  return [ia, ib];
};
function settle(){           // 初學者：停在下一個需要彈奏的位置
  while (idx < steps.length && !need(steps[idx]).length) go(1);
  pressed.clear(); refresh();
  if (idx >= steps.length) say('完成！');
}
function advanceWait(){ go(1); const r = loopRange(); if (r && idx > r[1]) seek(r[0]); settle(); }
function restart(){
  stop(); osmd.cursor.reset(); idx = 0; bars = []; tcur = -1e9; fp = 0; G.on = false;
  if (mode === 'beginner') settle(); else refresh();
}
const T = s => s.bt * 60 / bpm / spd;
function stop(){ playing = false; $('play').textContent = '開始'; $('spd').disabled = false; metroSync(); }
function startPlay(){
  if (!steps.length) return;
  if (mode === 'game'){ restart(); gameInit(); t0 = performance.now() + 3000 - T(steps[0]) * 1000; spawnI = 0; say('3 秒後開始'); }
  else { if (idx >= steps.length - 1) restart(); t0 = performance.now() - T(steps[idx]) * 1000; spawnI = idx; say(MODES[mode] + '模式'); }
  buildFall(); playing = true; $('play').textContent = '暫停'; $('spd').disabled = true; metroSync();
}
function setMode(m){
  mode = m; $('mode').value = m; document.body.dataset.mode = m;
  document.body.classList.toggle('single', m === 'hint' || m === 'glow' || m === 'game');
  document.body.classList.toggle('two', m === 'beginner');
  $('hud').style.display = 'none';
  if (osmd && steps.length) restart();
}
async function loadScore(data, name){
  say('讀取琴譜…'); stop();
  try {
    if (!osmd) osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay('score', {backend:'svg', autoResize:false, followCursor:false, drawPartNames:false});
    await osmd.load(data); osmd.render(); osmd.cursor.show();
    bpm = Math.round(osmd.Sheet.DefaultStartTempoInBpm || 100); build(); initSpeed(); setMode(mode);
    say((name || '琴譜') + '：' + MODES[mode] + '模式' + (mode === 'beginner' ? '，按下亮起的琴鍵' : '，按「開始」'));
  } catch (e){ say('讀取失敗：' + e.message); }
}
let rzT = 0;
addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => {
  if (!osmd || !steps.length) return;
  const i = idx; stop(); osmd.render(); osmd.cursor.show(); build(); go(i); refresh(); buildFall();
}, 300); });

/* 節拍器（Web Audio） */
let actx = null, metroOn = false, mT0 = 0, nextB = 0;
function clickAt(t, accent){
  const o = actx.createOscillator(), gn = actx.createGain();
  o.frequency.value = accent ? 1500 : 1000;
  gn.gain.setValueAtTime(.0001, t); gn.gain.exponentialRampToValueAtTime(.4, t + .002); gn.gain.exponentialRampToValueAtTime(.0001, t + .06);
  o.connect(gn); gn.connect(actx.destination); o.start(t); o.stop(t + .08);
}
const spb = () => 60 / (bpm * spd);
function metroSync(){
  if (!actx) return; const now = actx.currentTime + .05;
  if (playing && steps[idx]){ mT0 = now - steps[idx].bt * spb(); nextB = Math.ceil(steps[idx].bt - 1e-6); } else { mT0 = now; nextB = 0; }
}
$('metro').onchange = e => { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); metroOn = e.target.checked; metroSync(); };
$('hand').onchange = e => { hand = e.target.value; if (osmd && steps.length){ buildFall(); mode === 'beginner' ? settle() : refresh(); } };

/* 遊戲模式 */
let G = {on: false, notes: [], mp: 0, gp: 0, score: 0, combo: 0, max: 0, c: [0, 0, 0, 0]}, calOff = 0, cal = null;
try { calOff = +localStorage.getItem('calOff') || 0; } catch (e){}
const JN = [['EXCELLENT', '#ffd54a', 100], ['GOOD', '#7be07b', 70], ['NOT BAD', '#6ec6ff', 40]];
function gameInit(){
  G = {on: true, notes: [], mp: 0, gp: 0, score: 0, combo: 0, max: 0, c: [0, 0, 0, 0]};
  steps.forEach(st => st.nt.forEach(x => G.notes.push({n: x.m, t: T(st), d: false})));
  $('hud').style.display = 'block'; hudUpdate();
}
const tGame = now => (now - t0) / 1000 - calOff / 1000;
function hudUpdate(){ $('hud').innerHTML = '分數 ' + G.score + '<br>連擊 ' + G.combo + '（最高 ' + G.max + '）<br><small>E ' + G.c[0] + '　G ' + G.c[1] + '　N ' + G.c[2] + '　M ' + G.c[3] + '</small>'; }
function pop(n, txt, col){
  const k = keyEls[n]; if (!k) return; const r = k.getBoundingClientRect(), e = document.createElement('div');
  e.className = 'jp'; e.textContent = txt; e.style.left = (r.left + r.width / 2) + 'px'; e.style.top = (r.top - 10) + 'px'; e.style.color = col;
  document.body.appendChild(e); setTimeout(() => e.remove(), 800);
}
function comboPop(c){
  const e = document.createElement('div'), em = ['✨','🔥','🎉','⭐','🎵'][Math.random() * 5 | 0], sz = Math.min(7 + c / 8, 14) * (.6 + Math.random() * .6);
  e.className = 'cp'; e.textContent = em + ' ' + c + ' COMBO!';
  e.style.cssText = 'left:' + (4 + Math.random() * 45) + 'vw;top:' + (6 + Math.random() * 38) + 'vh;font-size:' + sz + 'vmin;color:hsl(' + (Math.random() * 360 | 0) + ',95%,62%);--r:' + ((Math.random() * 36 - 18) | 0) + 'deg';
  document.body.appendChild(e); setTimeout(() => e.remove(), 1100);
}
function judge(n, tp){
  while (G.gp < G.notes.length && (G.notes[G.gp].d || G.notes[G.gp].t < tp - .2)) G.gp++;
  for (let k = G.gp; k < G.notes.length; k++){
    const o = G.notes[k]; if (o.t > tp + .2) break; if (o.d || o.n !== n) continue;
    const e = Math.abs(tp - o.t); if (e > .2) continue;
    o.d = true; const j = e <= .06 ? 0 : e <= .12 ? 1 : 2;
    G.score += JN[j][2]; G.c[j]++; G.combo++; G.max = Math.max(G.max, G.combo);
    pop(n, JN[j][0], JN[j][1]); if (G.combo % 10 === 0) comboPop(G.combo); hudUpdate(); return;
  }
}
function miss(n){ G.c[3]++; G.combo = 0; pop(n, 'MISS', '#ff6b6b'); hudUpdate(); }
function finishGame(){

    if (b & 0x80){ const n = d[i + 1]; if (n === undefined) break; if (n & 0x80){ s = n; i += 2; } else { s = run; i++; } } else s = run;
    if (!s){ i++; continue; }
    if (s >= 0xF8) continue;
    if (s === 0xF0){ sx = true; run = 0; continue; }
    run = s >= 0xF0 ? 0 : s;
    const l = s >= 0xF0 ? (s === 0xF1 || s === 0xF3 ? 1 : s === 0xF2 ? 2 : 0) : (((s & 0xF0) === 0xC0 || (s & 0xF0) === 0xD0) ? 1 : 2), m = [s];
    while (m.length <= l && i < d.length && !(d[i] & 0x80)) m.push(d[i++]);
    if (m.length === l + 1) o.push(m);
  }
  return o;
}
$('ble').onclick = async () => {
  if (!navigator.bluetooth){ say('此瀏覽器不支援 Web Bluetooth，請用 Chrome 或 Edge'); return; }
  try {
    dev = await navigator.bluetooth.requestDevice({filters:[{services:[SVC]}]});
    dev.addEventListener('gattserverdisconnected', () => { say('藍牙已斷線'); held.clear(); paint(); });
    const c = await (await (await dev.gatt.connect()).getPrimaryService(SVC)).getCharacteristic(CHR);
    c.addEventListener('characteristicvaluechanged', e => {
      const v = e.target.value; run = 0; sx = false;
      for (const m of parse(new Uint8Array(v.buffer, v.byteOffset, v.byteLength))){
        const t = m[0] & 0xF0;
        if (t === 0xB0) setPedal(m[1], m[2]);
        else if (t === 0x90 && m[2] > 0) onNote(true, m[1]);
        else if (t === 0x80 || t === 0x90) onNote(false, m[1]);
      }
    });
    await c.startNotifications(); say('已連線：' + (dev.name || '藍牙琴'));
  } catch (e){ say('藍牙失敗：' + e.name); }
};
setMode('hint'); say('按「示範曲」開始');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
